---
name: CI

# Twelve production MCP servers pin this package by tag. Nothing here may
# be tagged until this workflow is green on the commit being tagged.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor; 3.14 is the Lambda runtime
        # every deployment uses.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check core/ server/ tests/

      # Run both ways: the serial run catches state leaking between tests
      # in file order, the parallel run catches tests that only pass
      # because an earlier test in the same process set something up.
      - name: Tests, serial
        run: python -m pytest tests/ -q -p no:xdist -p no:cacheprovider

      - name: Tests, parallel
        run: python -m pytest tests/ -q -n auto -p no:cacheprovider

  version:
    name: Version matches the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A deployment pins `@vX.Y.Z` and its test suite compares the
      # installed version to the pin, so a tag whose pyproject version
      # differs would break every fork that adopts it.
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: pyproject version equals core.__version__
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          runtime=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('core/__init__.py').read()).group(1))")
          echo "pyproject: $declared   core.__version__: $runtime"
          test "$declared" = "$runtime"
          echo "DECLARED=$declared" >> "$GITHUB_ENV"

      - name: Version equals the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $DECLARED   tag: $tag"
          test "$DECLARED" = "$tag"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/
